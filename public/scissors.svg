<!-- Vector redraw of the user's reference shears (700x700 space, blades left, rings right). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 150 620 380" width="620" height="380">
  <g fill="#2b1a12" stroke="#2b1a12" stroke-linejoin="round" stroke-linecap="round">
    <!-- upper blade: fine point upper-left, widening into the pivot -->
    <path stroke-width="2" d="M92 221 C170 246 240 276 306 300 L300 338 C262 330 196 290 92 221 Z" />
    <!-- lower blade -->
    <path stroke-width="2" d="M66 368 C150 346 226 326 292 306 L306 338 C232 350 150 364 66 368 Z" />
    <!-- arm to upper ring -->
    <path stroke-width="2" d="M296 304 C380 286 452 270 522 252 L532 276 C458 292 384 316 304 338 Z" />
    <!-- arm to lower ring -->
    <path stroke-width="2" d="M302 334 C356 364 404 398 450 436 L436 452 C392 418 344 384 294 348 Z" />
    <!-- finger rings -->
    <circle cx="562" cy="236" r="42" fill="none" stroke-width="10" />
    <circle cx="484" cy="480" r="42" fill="none" stroke-width="10" />
    <!-- finger rest on the upper ring -->
    <path fill="none" stroke-width="9" d="M596 212 L618 192" />
    <circle cx="620" cy="190" r="9" stroke-width="2" />
    <!-- small tang on the lower ring -->
    <circle cx="516" cy="438" r="6" stroke-width="2" />
    <!-- pivot screw -->
    <circle cx="298" cy="320" r="17" stroke-width="2" />
  </g>
  <circle cx="298" cy="320" r="7" fill="#f7f2ec" />
</svg>
